version: "3.8"
services:
  # ── Meta2Cloud ────────────────────────────────────────────────
  # host 网络模式下 upload.sh 用 localhost:38765/trigger 触发
  # WebUI 地址：http://localhost:38765
  meta2cloud:
    container_name: meta2cloud
    image: benz1/meta2cloud:latest
    environment:
      - TZ=Asia/Shanghai
    volumes:
      # 运行时配置与数据（115 token、library.db 等），不打包进镜像
      - ${PWD}/meta2cloud-config:/app/config
    network_mode: host
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 1m
