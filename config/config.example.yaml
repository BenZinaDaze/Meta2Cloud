# ─────────────────────────────────────────────────────────
# WebUI 认证设置
# ─────────────────────────────────────────────────────────
webui:
  # 登录用户名（留空则使用系统默认值）
  username: ""

  # 登录密码（必填，留空则任何人都可以访问——非常不安全）
  password: ""

  # JWT 签名密钥（留空则自动生成并保存到 config/data/.jwt_secret）
  # 生产环境可指定固定密钥，确保重启后现有 token 仍有效
  secret_key: ""

  # Token 有效期（小时），默认 24 小时
  token_expire_hours: 24

  # /trigger 端点的 Webhook 密钥（留空则不校验，适合内网部署）
  # rclone 通知时需在请求头 X-Webhook-Secret 中携带此密钥
  webhook_secret: ""

  # 日志保留天数
  # 日志按天写入 config/data/logs/YYYY-MM-DD.jsonl，超过保留天数的旧文件会自动清理
  log_retention_days: 7

# ─────────────────────────────────────────────────────────
# 存储后端设置
# ─────────────────────────────────────────────────────────
storage:
  # 主流程使用的存储 Provider
  # 当前支持 pan115
  # pipeline.py / organizer 会使用此 Provider 进行文件整理
  # 也可以通过 CLI 参数 --storage 覆盖
  primary: "pan115"

# Meta2Cloud 配置文件

# ─────────────────────────────────────────────────────────
# TMDB 设置
# ─────────────────────────────────────────────────────────
tmdb:
  # TMDB v3 API Key（必填）
  # 申请地址：https://www.themoviedb.org/settings/api
  api_key: ""

  # 返回语言，IETF 语言标签
  # 常用：zh-CN（简体中文）、zh-TW、en-US、ja-JP
  language: "zh-CN"

  # HTTP 代理（可选），示例：http://proxy-host:port
  proxy: ""

  # 请求超时（秒）
  timeout: 10

  # TMDB 图片代理根域名（可选）
  # 只填根域名，不要带 /t/p；留空则使用默认 https://image.tmdb.org
  image_base_url: ""

# 文件名识别规则已独立到同目录的 parser-rules.yaml
# 请复制 config/parser-rules.example.yaml 为 parser-rules.yaml 后单独维护

# ─────────────────────────────────────────────────────────
# 流水线设置（pipeline.py）
# ─────────────────────────────────────────────────────────
pipeline:
  # 是否跳过 TMDB 查询（True = 只整理文件夹，不生成 NFO）
  skip_tmdb: false

  # TMDB 找不到元数据时是否仍然移动文件
  # True  = 找不到也继续移动（不生成 NFO）
  # False = 找不到则跳过该文件
  move_on_tmdb_miss: false

  # dry_run 模式（True = 只打印计划，不实际操作网盘）
  # 命令行 --dry-run 参数优先级更高
  dry_run: false

  # 替换同名视频（移除的文件可在回收站恢复）
  replace_existing_video: false

  # 剧集只上传 tvshow.nfo；电影仍上传同名 .nfo
  # True = 跳过单集 .nfo、season.nfo，以及所有图片上传
  skip_metadata_upload: false

  # 重复目录自动合并
  # TMDB 译名变更可能产生同一媒体的多个目录；开启后整理时自动把
  # 其它目录的文件并入首次整理的目录（整理名称页可见），腾空后进回收站。
  # True = 自动合并（默认）；False = 保留重复目录
  merge_duplicate_folders: true

# ─────────────────────────────────────────────────────────
# 字幕整理设置
# ─────────────────────────────────────────────────────────
subtitle:
  # 是否整理字幕文件（.srt / .ass / .ssa）
  # True  = 字幕文件自动跟随视频移动到目标目录
  # False = 跳过字幕整理
  enabled: true

# ─────────────────────────────────────────────────────────
# Telegram 通知设置（可选）
# ─────────────────────────────────────────────────────────
telegram:
  # Bot Token，从 @BotFather 获取
  # 示例：your-bot-token
  bot_token: ""

  # 接收通知的 Chat ID（个人账号或群组）
  # 获取方式：给 bot 发一条消息后访问
  # https://api.telegram.org/bot<your-bot-token>/getUpdates
  # 找 "chat": {"id": ...}
  chat_id: ""

  # 防抖延时（秒）：server.py 收到 /trigger 后等待该时间才真正运行 Pipeline
  # 等待期间若再次收到触发，计时器重置（相当于"最后一次触发后再等 N 秒"）
  # 作用：批量入库时多集合并成一条 TG 通知，而不是每集发一次
  # 推荐：60（1 分钟），set 0 关闭防抖（立即触发，旧行为）
  debounce_seconds: 60

# ─────────────────────────────────────────────────────────
# MediaVault 集成（可选）
# ─────────────────────────────────────────────────────────
mediavault:
  # 整理成功入库后，触发 MediaVault 目录监控
  enabled: false

  # 接口协议
  # 可选值：http / https
  scheme: "http"

  # MediaVault 地址
  # 只填主机或主机:端口，不要带 http:// 或 https://
  host: ""

  # MediaVault API Key
  api_key: ""

  # 可选：传给 MediaVault 的 source_dir
  # 留空则使用 MediaVault 默认目录
  source_dir: ""

  # 请求超时（秒）
  timeout: 10

# ─────────────────────────────────────────────────────────
# 观看同步：Trakt ↔ Plex 双向同步（可选）
# ─────────────────────────────────────────────────────────
# WebUI「配置 → 观看同步」页可完成全部配对与选项设置。
# 说明：
#   - Trakt 已看记录 → Plex 标记已看；Plex 已看/正在看（≥80% 进度）→ 记录到 Trakt
#   - 首次同步会合并两侧已看记录（并集），之后按增量双向同步；
#     同一媒体两侧状态冲突时以 Trakt 为准（Trakt 记录更全更权威）
#   - 身份以 TMDB ID 为锚：优先使用 Plex 条目的 tmdb:// GUID，
#     否则按 Meta2Cloud 组织目录名（Title (Year)）反查
trakt:
  # 是否启用定时同步
  enabled: false

  # Trakt 应用凭证（https://trakt.tv/oauth/applications 创建应用后获取）
  # 创建建议：类型任选，Redirect URI 填 http://localhost（授权走设备码流程，不发生回调）
  # Trakt 为 PKCE 模式，无需 Client Secret
  client_id: ""

  # 授权 token 持久化路径（设备码配对成功后自动写入，90 天自动续期）
  token_json: "config/trakt-token.json"

  # 双向全量同步间隔（秒）；<60 视为关闭定时同步，仅手动触发
  sync_interval_seconds: 900

  # 「正在看」会话轮询间隔（秒）；播放进度 ≥80% 时记录到 Trakt
  session_poll_seconds: 45

  # 同步方向开关：Trakt → Plex / Plex → Trakt
  sync_to_plex: true
  sync_to_trakt: true

plex:
  # Plex Media Server 地址（Meta2Cloud 所在机器需能直连）
  base_url: ""

  # 授权凭证持久化路径（PIN 授权成功后自动写入；含 client_identifier 配对态）
  token_json: "config/plex-auth.json"

  # 请求超时（秒）
  timeout: 10
